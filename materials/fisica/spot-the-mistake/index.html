</style><header><a href="../index.html">← Materials de Física</a><select aria-label="Idioma"><option value="ca">CAT</option><option value="es">ESP</option><option value="en">ANG</option></select></header><main></main><noscript>Cal activar JavaScript · Activa JavaScript · Enable JavaScript</noscript><script>const data={"ca":["Detecta l’error!","Detectius de la densitat","Llegeix cada resposta. Identifica el primer error, corregeix-lo i explica per què.","Pista","Comprova la correcció","Escriu la teva explicació","← Materials de Física",[["Flotarà? Un bloc té 200 g de massa i 250 cm³ de volum. La densitat de l’aigua és 1,0 g/cm³.","200 ÷ 250 = 0,8 g/cm³. S’enfonsa perquè pesa molt.","Compara les densitats.","Sura: 0,8 g/cm³ és menys que 1,0 g/cm³."],["Capacitat i volum. Expressa 1,5 L en cm³.","1,5 L = 1,5 dm³. Multiplico per 10: 15 cm³.","Què indica el ³?","1,5 dm³ × 1.000 cm³/dm³ = 1.500 cm³."],["Converteix 2,4 g/cm³ a kg/cm³.","Divideixo per 1.000: 0,0024 kg/m³.","Quina unitat es conserva?","0,0024 kg/cm³. Només canvia la unitat de massa."],["Un líquid té una densitat de 0,8 g/mL i ocupa 2 L. Quina massa té?","Massa = densitat × volum = 0,8 × 2 = 1,6 g.","En quina unitat ha d’estar el volum?","2 L = 2.000 mL. La massa és 0,8 g/mL × 2.000 mL = 1.600 g."],["Repte individual. Calcula la massa de 0,25 L d’un líquid de densitat 1,2 g/mL. Mostra el procediment.","","","0,25 L = 250 mL; 1,2 g/mL × 250 mL = 300 g. Els mL se simplifiquen."]]],"es":["¡Detecta el error!","Detectives de la densidad","Lee cada respuesta. Identifica el primer error, corrígelo y explica por qué.","Pista","Comprueba la corrección","Escribe tu explicación","← Materiales de Física",[["¿Flotará? Un bloque tiene una masa de 200 g y un volumen de 250 cm³. La densidad del agua es 1,0 g/cm³.","200 ÷ 250 = 0,8 g/cm³. Se hunde porque pesa mucho.","Compara las densidades.","Flota: 0,8 g/cm³ es menor que 1,0 g/cm³."],["Capacidad y volumen. Expresa 1,5 L en cm³.","1,5 L = 1,5 dm³. Multiplico por 10: 15 cm³.","¿Qué indica el ³?","1,5 dm³ × 1.000 cm³/dm³ = 1.500 cm³."],["Convierte 2,4 g/cm³ a kg/cm³.","Divido por 1.000: 0,0024 kg/m³.","¿Qué unidad se conserva?","0,0024 kg/cm³. Solo cambia la unidad de masa."],["Un líquido tiene una densidad de 0,8 g/mL y ocupa 2 L. ¿Qué masa tiene?","Masa = densidad × volumen = 0,8 × 2 = 1,6 g.","¿En qué unidad debe estar el volumen?","2 L = 2.000 mL. La masa es 0,8 g/mL × 2.000 mL = 1.600 g."],["Reto individual. Calcula la masa de 0,25 L de un líquido con densidad de 1,2 g/mL. Muestra los pasos.","","","0,25 L = 250 mL; 1,2 g/mL × 250 mL = 300 g. Los mL se cancelan."]]],"en":["Spot the Mistake!","Density detectives","Read each answer. Find the first mistake, correct it and explain why.","Hint","Check the correction","Write your explanation","← Physics resources",[["Will it float? A block has a mass of 200 g and a volume of 250 cm³. Water has a density of 1.0 g/cm³.","200 ÷ 250 = 0.8 g/cm³. It sinks because it is heavy.","Compare the densities.","It floats: 0.8 g/cm³ is less than 1.0 g/cm³."],["Capacity and volume. Write 1.5 L in cm³.","1.5 L = 1.5 dm³. I multiply by 10: 15 cm³.","What does the ³ mean?","1.5 dm³ × 1,000 cm³/dm³ = 1,500 cm³."],["Convert 2.4 g/cm³ to kg/cm³.","I divide by 1,000: 0.0024 kg/m³.","Which unit stays the same?","0.0024 kg/cm³. Only the mass unit changes."],["A liquid has a density of 0.8 g/mL and a volume of 2 L. What is its mass?","Mass = density × volume = 0.8 × 2 = 1.6 g.","Which unit do you need for the volume?","2 L = 2,000 mL. The mass is 0.8 g/mL × 2,000 mL = 1,600 g."],["Work on your own. Find the mass of 0.25 L of a liquid with a density of 1.2 g/mL. Show your steps.","","","0.25 L = 250 mL; 1.2 g/mL × 250 mL = 300 g. The mL units cancel."]]]}, notes=Array(5).fill(''), s=document.querySelector('select'), m=document.querySelector('main');
function render(){const l=s.value,[title,sub,intro,hint,check,write,back,items]=data[l];document.documentElement.lang=l;document.title=title+' · SciencEduca';s.setAttribute('aria-label',({ca:'Idioma',es:'Idioma',en:'Language'})[l]);document.querySelector('header a').textContent=back;
m.innerHTML='<p class="tag">SciencEduca · '+({ca:'2n d’ESO',es:'2.º de ESO',en:'CLIL B1'})[l]+'</p><h1>'+title+'</h1><h2>'+sub+'</h2><p>'+intro+'</p><p class="tag">'+({ca:'L’error és… Primer converteixo… perquè…',es:'El error es… Primero convierto… porque…',en:'The mistake is… First, I convert… because…'})[l]+'</p>'+items.map(([q,a,h,k],i)=>'<article><h3>'+String(i+1).padStart(2,'0')+' · '+q+'</h3>'+(a?'<blockquote>'+a+'</blockquote>':'')+'<label for="answer'+i+'">'+write+'</label><textarea id="answer'+i+'" rows="3"></textarea>'+(h?'<details><summary>'+hint+'</summary><p>'+h+'</p></details>':'')+'<details><summary>'+check+'</summary><p>'+k+'</p></details></article>').join('');
m.querySelectorAll('textarea').forEach((t,i)=>{t.value=notes[i];t.oninput=()=>notes[i]=t.value})}s.onchange=render;render();</script></html>
