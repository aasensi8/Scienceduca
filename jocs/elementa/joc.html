function show(view){if(view!=='result'&&$('result-dialog').open)$('result-dialog').close();for(const id of ['setup','game','result'])$(id).hidden=id!==view;$('lang').disabled=view==='game'}
function beep(good){if(!$('sound').checked)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=good?660:220;g.gain.setValueAtTime(.06,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.14);o.start();o.stop(audioCtx.currentTime+.15)}catch{}}
function start(reviewItems=null){worldLevel=0;worldStep=-1;clearTimeout(worldFlash);clearTimeout(worldJump);const c=config();const tokens=$('custom').value.split(/[\s,;]+/).filter(Boolean);const invalid=tokens.filter(sym=>!elementsData.some(e=>e.sym===sym));const minimum=c.format==='choice'?4:1;if(!reviewItems&&$('pool').value==='custom'&&(invalid.length||c.pool.length<minimum)){$('custom-error').textContent=invalid.length?`${t('invalid')} ${invalid.join(', ')}`:`${t('minimum')} ${minimum} ${t('elements')}.`;return}$('custom-error').textContent='';cancel();session={c,review:!!reviewItems,pool:reviewItems||c.pool,queue:[],due:new Map(),pending:new Set((reviewItems||[]).map(e=>e.sym)),mistakes:new Map(),correct:0,wrong:0,streak:0,best:0,lives:3,remaining:c.duration*1000,phase:'ready',turn:0,last:null,current:null,direction:'name',lastTick:performance.now()};$('robot').classList.remove('fall');$('level-flash').hidden=true;document.body.classList.toggle('reduced',$('reduced').checked);show('game');$('session-kind').textContent=reviewItems?t('reviewtitle'):t(c.play==='free'?'free':c.play==='timed'?'timed':'train');nextQuestion();timer=setInterval(tick,100)}
function isTimed(){return session&&!session.review&&session.c.play==='timed'}
function tick(){if(!session)return;const now=performance.now();if(session.phase==='answer'&&isTimed()){session.remaining=Math.max(0,session.remaining-(now-session.lastTick));$('time').textContent=Math.ceil(session.remaining/1000)+'s';if(session.remaining<=0)finish('timeout')}session.lastTick=now}
function chooseElement(){const s=session;let candidates=s.review?s.pool.filter(e=>s.pending.has(e.sym)):s.pool;if(s.review&&candidates.length===0)return null;const due=[...s.due].filter(([sym,at])=>at<=s.turn&&sym!==s.last&&candidates.some(e=>e.sym===sym));if(due.length){const sym=due[0][0];s.due.delete(sym);return candidates.find(e=>e.sym===sym)}s.queue=s.queue.filter(e=>candidates.includes(e));if(!s.queue.length)s.queue=shuffle(candidates);let idx=s.queue.findIndex(e=>e.sym!==s.last);if(idx<0)idx=0;return s.queue.splice(idx,1)[0]}
function nextQuestion(){const s=session;if(!s||s.phase==='end')return;const e=chooseElement();if(!e){finish('reviewdone');return}s.current=e;s.last=e.sym;s.turn++;s.direction=s.c.direction==='mixed'?(Math.random()<.5?'name':'symbol'):s.c.direction;$('question').textContent=s.direction==='name'?e.sym:e.name[lang];$('prompt').textContent=t(s.direction==='name'?'promptname':'promptsymbol');$('feedback').textContent='';$('feedback').className='feedback';$('notice').textContent='';$('continue').hidden=true;$('answer').value='';$('answer').disabled=false;$('submit').disabled=false;const choice=s.c.format==='choice';$('answer-form').hidden=choice;$('choices').hidden=!choice;$('choices').replaceChildren();if(choice){const others=shuffle(s.c.pool.filter(x=>x.sym!==e.sym)).slice(0,3);shuffle([e,...others]).forEach(item=>{const b=document.createElement('button');b.type='button';b.textContent=s.direction==='name'?item.name[lang]:item.sym;b.onclick=()=>answer(b.textContent);$('choices').append(b)})}s.phase='answer';s.lastTick=performance.now();render();if(choice)$('choices').querySelector('button')?.focus();else $('answer').focus()}
function render(){const s=session;const level=1+Math.floor(s.correct/10);$('correct').textContent=s.correct;$('level').textContent=level;$('lives').textContent=s.review||s.c.play==='train'?'∞':'♥ '.repeat(s.lives).trim()||'—';$('streak').textContent=s.streak;$('best').textContent=s.best;$('time').textContent=isTimed()?Math.ceil(s.remaining/1000)+'s':'∞';$('scene-title').textContent=`${t('level')} ${level}`;$('altitude').textContent=`${s.correct} ↗`;$('height').textContent=`${s.correct} ${t('steps')}`;$('scene').dataset.theme=String((level-1)%4);renderWorld();$('progress').value=s.correct%10;$('progress-label').textContent=`${t('next')}: ${s.correct%10}/10`;$('errors').textContent=`${t('errors')}: ${s.wrong}`}
function answer(raw){const s=session;if(!s||s.phase!=='answer')return;tick();if(s.phase!=='answer')return;raw=raw.trim();if(!raw){$('feedback').textContent=t('empty');return}const e=s.current;const correct=s.direction==='name'?nameMatches(raw,e):s.c.strict==='strict'?raw===e.sym:normalize(raw)===normalize(e.sym);s.phase='feedback';$('answer').disabled=true;$('submit').disabled=true;$('choices').querySelectorAll('button').forEach(b=>b.disabled=true);let notices=[];if(correct){s.correct++;s.streak++;s.best=Math.max(s.best,s.streak);s.due.delete(e.sym);if(s.review)s.pending.delete(e.sym);if(s.correct%10===0){notices.push(t('newlevel'));flashLevel();}if(s.streak%20===0&&!s.review&&s.c.play!=='train'){if(s.lives<3){s.lives++;notices.push(t('life'))}else notices.push(t('full'))}if(s.direction==='symbol'&&raw!==e.sym)notices.push(`${t('capital')} ${e.sym}`)}else{s.wrong++;s.streak=0;s.mistakes.set(e.sym,e);s.due.set(e.sym,s.turn+3);if(!s.review&&s.c.play!=='train')s.lives--}beep(correct);render();$('feedback').className='feedback '+(correct?'good':'bad');$('feedback').textContent=correct?`${t('right')} ${e.sym} — ${e.name[lang]}`:`${t('wrong')}: ${e.sym} — ${e.name[lang]}`;$('notice').textContent=notices.join(' · ');const fallen=!s.review&&s.c.play!=='train'&&s.lives<=0;if(fallen)$('robot').classList.add('fall');$('continue').hidden=false;$('continue').onclick=()=>fallen?finish('fell'):nextQuestion();$('continue').focus();if(correct&&!notices.length){transition=setTimeout(()=>{if(session===s&&s.phase==='feedback')nextQuestion()},2000)}}
function finish(reason='finished'){if(!session||session.phase==='end')return;cancel();const s=session;s.phase='end';if(!s.review){const key=recordKey(s.c),prev=readStore(key)||{};saveStore(key,{correct:Math.max(prev.correct||0,s.correct),best:Math.max(prev.best||0,s.best)})}show('result');if(!$('result-dialog').open)$('result-dialog').showModal();$('result-title').textContent=t(reason);$('result-context').textContent=s.review?t('reviewnote'):`${t(s.c.play==='free'?'free':s.c.play==='timed'?'timed':'train')} · ${t(s.c.format==='write'?'write':'choice')} · ${s.c.pool.length} ${t('elements')}`;$('result-stats').replaceChildren();const total=s.correct+s.wrong;[[t('correct'),s.correct],[t('level'),1+Math.floor(s.correct/10)],[t('best'),s.best]].forEach(([label,value])=>{const d=document.createElement('div');d.className='stat';const small=document.createElement('small');small.textContent=label;const strong=document.createElement('strong');strong.textContent=value;d.append(small,strong);$('result-stats').append(d)});$('review-list').replaceChildren();const mistakes=[...s.mistakes.values()];const p=document.createElement('p');p.textContent=mistakes.length?t('pending'):t('none');$('review-list').append(p);if(mistakes.length){const ul=document.createElement('ul');mistakes.forEach(e=>{const li=document.createElement('li');li.textContent=`${e.sym} — ${e.name[lang]}`;ul.append(li)});$('review-list').append(ul)}$('review').hidden=!mistakes.length;$('review').onclick=()=>start(mistakes);$('retry').onclick=()=>start();$('result-title').tabIndex=-1;$('result-title').focus()}
$('result-dialog').addEventListener('cancel',e=>e.preventDefault());
$('answer-form').onsubmit=e=>{e.preventDefault();answer($('answer').value)};$('continue').addEventListener('click',()=>{clearTimeout(transition)});$('start').onclick=()=>start();$('finish').onclick=()=>finish();$('settings').onclick=()=>{cancel();show('setup');updateRecord()};$('lang').onchange=()=>{lang=$('lang').value;translate();applyTheme(document.body.classList.contains('light')?'light':'dark');if(!$('result').hidden)show('setup')};['play','pool','direction','format','strict','duration'].forEach(id=>$(id).onchange=()=>{$('duration-label').hidden=$('play').value!=='timed';$('custom-label').hidden=$('pool').value!=='custom';$('strict').disabled=$('format').value==='choice';updateRecord()});$('custom').oninput=updateRecord;window.addEventListener('resize',()=>{if(session&&session.phase!=='end')render()});
let worldLevel=0,worldStep=-1,worldJump=null,worldFlash=null;
function renderWorld(){const s=session,level=1+Math.floor(s.correct/10),step=s.correct%10;const world=$('platform-world');const changed=worldLevel!==level;if(changed){world.querySelectorAll('.platform').forEach(e=>e.remove());for(let i=0;i<10;i++){const block=document.createElement('div');block.className='platform';block.style.setProperty('--x',(i%2===0?29:70)+'%');block.style.setProperty('--y',(i*8.1)+'%');const num=document.createElement('span');num.textContent=i+1;block.append(num);world.insertBefore(block,$('robot'))}worldLevel=level}world.querySelectorAll('.platform').forEach((p,i)=>p.classList.toggle('active',i===step));const robot=$('robot');if(changed){robot.style.transition='none';robot.classList.remove('jumping')}else if(worldStep!==step){robot.classList.remove('jumping');void robot.offsetWidth;robot.classList.add('jumping');clearTimeout(worldJump);worldJump=setTimeout(()=>robot.classList.remove('jumping'),500)}robot.style.left=(step%2===0?29:70)+'%';robot.style.bottom=`calc(${step*8.1}% + 18px)`;if(changed){void robot.offsetWidth;robot.style.transition=''}worldStep=step}
function flashLevel(){clearTimeout(worldFlash);$('level-flash').textContent=`${t('level')} ${1+Math.floor(session.correct/10)} ✦`;$('level-flash').hidden=false;worldFlash=setTimeout(()=>{$('level-flash').hidden=true},1500)}
function applyTheme(theme){document.body.classList.toggle('light',theme==='light');$('theme').textContent=theme==='light'?'☾':'☀';const label=lang==='ca'?(theme==='light'?'Activa el mode fosc':'Activa el mode clar'):lang==='es'?(theme==='light'?'Activa el modo oscuro':'Activa el modo claro'):(theme==='light'?'Switch to dark mode':'Switch to light mode');$('theme').setAttribute('aria-label',label);$('theme').title=label;saveStore('elementa-theme',theme)}
$('theme').onclick=()=>applyTheme(document.body.classList.contains('light')?'dark':'light');
applyTheme(readStore('elementa-theme')||(window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));

translate();
</script></body></html>
